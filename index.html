    <!-- Content-Security-Policy: locks down what scripts/connections/styles the page can use.
         Allows: self for code, Google Fonts (CSS host + woff host), unauthenticated GitHub API
         + raw blob host for scan reads, the two BYOK AI providers (only contacted when the user
         opts in by saving a key), and Cloudflare Pages Web Analytics beacon (page-view counter,
         no PII). Inline-style is allowed because Vite-bundled component styles live inline;
         inline-script is NOT allowed. `frame-ancestors` is delivered via the _headers file
         instead of here — browsers ignore that directive when set via a <meta> element. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://api.github.com https://raw.githubusercontent.com https://api.openai.com https://api.anthropic.com https://cloudflareinsights.com; base-uri 'self'; form-action 'self'; object-src 'none';"
    />

    <!-- Brand fonts: preconnect to cut connection-setup latency, then a regular stylesheet
         link. The non-blocking preload-swap pattern requires an inline event handler, which
         conflicts with our strict CSP. With preconnect already in place plus font-display
         swap baked into the URL, the perceived render cost is small: fallback text shows
         immediately, then re-flows when Rubik / Roboto land. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
