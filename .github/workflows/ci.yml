name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test + build + self-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests (Vitest)
        run: npm test

      - name: Production build
        run: npm run build

      # Self-audit reads dist/ + public/ + src/ and runs the scanner against itself.
      # The test file lives under src/test/ but explicitly requires dist/ to exist —
      # this re-run is the dogfooding gate.
      - name: Self-audit (scanner runs on its own dist/)
        run: npx vitest run src/test/self-audit.test.js

      - name: Upload built artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 14
