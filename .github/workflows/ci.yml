name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# PR-scoped concurrency: PR updates cancel prior PR runs, but main pushes never cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test + build + self-audit (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]

    steps:
      - name: Checkout
        # Pinned to SHA, not tag. A maintainer (or attacker) can move v4 to point
        # at a different commit; a SHA cannot be repointed. Update by replacing
        # the SHA AND the trailing version comment together. Last verified:
        # actions/checkout v4.3.1.
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        timeout-minutes: 2

      - name: Setup Node.js ${{ matrix.node }}
        # Pinned to SHA. Last verified: actions/setup-node v4.4.0.
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
        timeout-minutes: 2

      - name: Install dependencies
        run: npm ci
        timeout-minutes: 3

      - name: Lint (ESLint — no errors, no warnings)
        run: 'npm run lint -- --max-warnings 0'
        timeout-minutes: 2

      - name: Format check (Prettier — verify all files match style)
        run: 'npm run format:check'
        timeout-minutes: 2

      - name: Run unit tests (Vitest)
        run: npm test
        timeout-minutes: 5

      - name: Production build
        run: npm run build
        timeout-minutes: 5

      # Self-audit is intentionally excluded from the default Vitest glob (vitest.config.js)
      # because it requires dist/ to exist. We run it here as its own step AFTER the build,
      # so a build break is reported clearly rather than as a confusing test failure.
      - name: Self-audit (scanner runs on its own dist/)
        run: npm run test:self-audit
        timeout-minutes: 2

      - name: Upload built artifact
        if: success() && matrix.node == '22'
        # Pinned to SHA. Last verified: actions/upload-artifact v4.6.2.
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/
          retention-days: 14
        timeout-minutes: 2

  # Deploy to Cloudflare Pages, gated on the full test matrix passing. Because
  # `needs: test` waits for both Node legs (build + full suite + dogfood
  # self-audit), a red pipeline can never ship. This job is the SINGLE deploy
  # path: the Pages dashboard Git integration must be disconnected, or every
  # push deploys twice. Requires one repo secret: CLOUDFLARE_API_TOKEN
  # (a Cloudflare token with the "Cloudflare Pages: Edit" permission).
  deploy:
    name: Deploy to Cloudflare Pages (production)
    needs: test
    # Only real pushes to main deploy. PRs and other branches build + test but never ship.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read

    steps:
      - name: Checkout
        # Pinned to SHA. Last verified: actions/checkout v4.3.1.
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        timeout-minutes: 2

      - name: Setup Node.js 22
        # Pinned to SHA. Last verified: actions/setup-node v4.4.0.
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: 'npm'
        timeout-minutes: 2

      - name: Install dependencies
        run: npm ci
        timeout-minutes: 3

      # Rebuild in this job rather than reusing the test job's artifact: the build
      # is deterministic from the commit, and `needs: test` already proved this
      # exact tree builds and passes the dogfood self-audit.
      - name: Production build
        run: npm run build
        timeout-minutes: 5

      - name: Deploy to Cloudflare Pages
        # Pinned to SHA (mutable action tags are a dogfood finding — see src/lib/probes/ci.js).
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: d703d3a762ca67d67d2f8f8e8412d99e
          command: pages deploy dist --project-name=preflight --branch=main
        timeout-minutes: 5
