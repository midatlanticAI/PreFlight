# Pre-Flight Audit Tool — repo-local scanner configuration.
#
# This file is the canonical example of the `.preflight.yml` workflow: any project
# can drop one of these in their root to document intentional findings, time-box
# known debt, and allowlist self-domains for the URL Reputation probe.
#
# Schema: https://github.com/midatlanticAI/PreFlight (blob/main/src/lib/preflight-config.js
#
# Match strategy per suppress entry:
#   - `id: <stableId>`           — exact match against the finding's stableId.
#                                  Use this when you want a specific finding pinned.
#   - `probe + file + title-pattern` — triple match. File supports `*` (single segment)
#                                       and `**` (zero+ segments) globs. title-pattern
#                                       is a substring match unless it contains `*`.
#
# Optional fields:
#   reason:      Free text — why this is intentional / accepted.
#   disposition: 'false-positive' | 'wont-fix' | 'accepted-risk' (default: 'wont-fix')
#   expires:     ISO date or `~` for never. Past-expiry rules are ignored.
#
# Discipline: every entry below describes a finding that we currently choose not to
# fix in code. Stale entries (where the underlying code was fixed) are deleted, not
# left lying around. If you find an entry here that no longer matches any finding,
# delete it — keeping noop suppressions makes it impossible to tell intent from rot.

schema: preflight/v1

self_domains:
  - preflight.midatlantic.ai
  - midatlantic.ai

suppress:
  # --- Architecture / Code Quality: known monolith debt, tracked separately ---
  # The fix is the multi-hour split of App.jsx and probes.js. Suppressed with a hard
  # expiry so the deadline survives any later edit to this file.
  - probe: Architecture
    file: 'src/ (root)'
    title-pattern: 'consider splitting'
    disposition: wont-fix
    reason: 'App.jsx (~4100 lines) tracked as known debt — split planned alongside next major feature.'
    expires: '2026-09-01'
  - probe: Code Quality
    file: src/App.jsx
    title-pattern: 'consider splitting'
    disposition: wont-fix
    reason: 'See arch-monolith-split note. Same root cause.'
    expires: '2026-09-01'
  - probe: Code Quality
    file: src/lib/probes.js
    title-pattern: 'consider splitting'
    disposition: wont-fix
    reason: 'Manifest extraction (compromised-packages.json, typosquats.json) is the natural first cut; planned alongside next probe additions.'
    expires: '2026-09-01'

  # --- Architecture classifier informational ---
  # Always-emits info finding that reports the inferred project type so the type-specific
  # advice below it makes sense. Not actionable; suppression is the right answer until
  # the probe is restructured to emit this as scan metadata rather than as a finding.
  - probe: Architecture
    file: project root
    title-pattern: 'Detected: Monolithic SPA'
    disposition: accepted-risk
    reason: 'Architecture classifier output is informational. The split-recommendation finding above already tracks the actionable part.'
