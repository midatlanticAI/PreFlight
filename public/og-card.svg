<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <!-- Pre-Flight Open Graph card. 1200×630 per Facebook / LinkedIn / iMessage recommendations.
       Brand palette pulled from src/lib/theme.js so this stays in lockstep with the app. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1226"/>
      <stop offset="100%" stop-color="#11192e"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="rgba(159, 229, 221, 0.05)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background plate -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Left accent stripe -->
  <rect x="0" y="0" width="6" height="630" fill="#f26b1f"/>

  <!-- Eyebrow row -->
  <text x="80" y="115" font-size="20" font-weight="700" letter-spacing="3" fill="#f26b1f">MID-ATLANTIC AI</text>
  <text x="335" y="115" font-size="20" font-weight="400" letter-spacing="3" fill="#a8b1c5">· PRE-FLIGHT AUDIT TOOL</text>

  <!-- Wordmark — italic, accent orange -->
  <text x="80" y="245" font-size="120" font-weight="800" font-style="italic" letter-spacing="-2" fill="#f26b1f">Pre-Flight</text>

  <!-- Subhead — white, two lines -->
  <text x="80" y="335" font-size="48" font-weight="700" letter-spacing="-1" fill="#f5f7fa">An educational audit tool</text>
  <text x="80" y="395" font-size="48" font-weight="700" letter-spacing="-1" fill="#f5f7fa">for vibers building vibeware.</text>

  <!-- Tagline / body -->
  <text x="80" y="475" font-size="24" font-weight="400" fill="#a8b1c5">Free, in-browser security audit for AI-built apps.</text>
  <text x="80" y="510" font-size="24" font-weight="400" fill="#a8b1c5">Explains the pattern, not just the fix.</text>

  <!-- Footer row: badges + URL -->
  <g transform="translate(80, 560)">
    <!-- pill: 96 probes -->
    <rect x="0" y="0" width="120" height="32" rx="0" fill="#1b2d52" stroke="#3b6e69"/>
    <text x="60" y="22" font-size="14" font-weight="600" text-anchor="middle" fill="#9fe5dd" letter-spacing="1">96 PROBES</text>
    <!-- pill: free / no signup -->
    <rect x="135" y="0" width="180" height="32" rx="0" fill="#1b2d52" stroke="#3b6e69"/>
    <text x="225" y="22" font-size="14" font-weight="600" text-anchor="middle" fill="#9fe5dd" letter-spacing="1">FREE · NO SIGNUP</text>
    <!-- pill: in-browser -->
    <rect x="330" y="0" width="180" height="32" rx="0" fill="#1b2d52" stroke="#3b6e69"/>
    <text x="420" y="22" font-size="14" font-weight="600" text-anchor="middle" fill="#9fe5dd" letter-spacing="1">RUNS IN BROWSER</text>
  </g>

  <!-- URL at bottom right -->
  <text x="1120" y="590" font-size="18" font-weight="600" text-anchor="end" fill="#8a96b0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">preflight.midatlantic.ai</text>
</svg>
